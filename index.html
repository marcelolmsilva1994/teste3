<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Investimentos Mensais 2025</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tabletop@1.6.0/src/tabletop.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    canvas { max-width: 1000px; margin: auto; display: block; }
  </style>
</head>
<body>
  <h1>Teste1</h1>
  <canvas id="myChart" width="800" height="400"></canvas>

  <script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyBCKIqCRwswkUQP_or3WI1dOG3JyQGyousdaS_6w_lTyRjJSXXnl5PeMW5jq2lQ/pubhtml";

    function getRandomColor() {
      const r = Math.floor(Math.random() * 200);
      const g = Math.floor(Math.random() * 200);
      const b = Math.floor(Math.random() * 200);
      return `rgba(${r},${g},${b},1)`;
    }

    function createChart(meses, datasets) {
      const ctx = document.getElementById('myChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: { labels: meses, datasets: datasets },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'top' },
            title: { display: true, text: 'Investimentos Mensais 2025' }
          },
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    window.onload = function() {
      Tabletop.init({
        key: sheetURL,
        simpleSheet: true,
        callback: function(data) {
          if (!data || data.length === 0) {
            alert("Erro: não foi possível carregar os dados da planilha.");
            return;
          }

            data: [],

            backgroundColor: "rgba(0,0,0,0.05)",

          }));

            colunas.forEach((col, i) => {
              const valor = row[col] || "0";
