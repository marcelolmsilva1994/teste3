<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Investimentos Mensais 2025</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    canvas { max-width: 900px; margin: auto; display: block; }
  </style>
</head>
<body>
  <h1>Investimentos Mensais 2025</h1>
  <canvas id="myChart"></canvas>

  <script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRyBCKIqCRwswkUQP_or3WI1dOG3JyQGyousdaS_6w_lTyRjJSXXnl5PeMW5jq2lQ/pub?output=csv&gid=1444389821';

    fetch(csvUrl)
      .then(res => res.text())
      .then(csv => {
        const linhas = csv.trim().split('\n');
        const meses = [];
        const fundoML = [];
        const feriasML = [];

        linhas.slice(1).forEach(linha => {
          const cols = linha.split(',');
          meses.push(cols[0]);
          fundoML.push(parseFloat(cols[1]?.replace(/\s|€/g, '') || 0));
          feriasML.push(parseFloat(cols[2]?.replace(/\s|€/g, '') || 0));
        });

        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: meses,
            datasets: [
              { label: 'Fundo ML', data: fundoML, backgroundColor: 'rgba(255,99,132,0.7)' },
              { label: 'Férias ML', data: feriasML, backgroundColor: 'rgba(54,162,235,0.7)' }
            ]
          },
          options: {
            responsive: true,
            plugins: { legend: { position: 'top' }, title: { display: true, text: 'Investimentos Mensais 2025' } },
            scales: { y: { beginAtZero: true } },
            interaction: { mode: 'index', intersect: false },
            stacked: true
          }
        });
      })
      .catch(err => console.error('Erro ao carregar CSV:', err));
  </script>
</body>
</html>
