<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Investimentos Mensais 2025</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    canvas { max-width: 900px; margin: auto; display: block; }
  </style>
</head>
<body>
  <h1>Investimentos Mensais 2025</h1>
  <canvas id="myChart"></canvas>

  <script>
    const meses = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO"];
    const fundoML = [0, 3459, 3659, 3859, 4059, 4444, 4644, 4844];
    const feriasML = [647, 288, 161, 361, 270, 470, 350, 550];

    const ctx = document.getElementById('myChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: meses,
        datasets: [
          { label: 'Fundo ML', data: fundoML, backgroundColor: 'rgba(255,99,132,0.7)' },
          { label: 'Férias ML', data: feriasML, backgroundColor: 'rgba(54,162,235,0.7)' }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'top' }, title: { display: true, text: 'Investimentos Mensais 2025' } },
        scales: { y: { beginAtZero: true } },
        interaction: { mode: 'index', intersect: false },
        stacked: true
      }
    });
  </script>
</body>
</html>
