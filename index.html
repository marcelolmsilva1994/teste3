<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Refeições</title>
</head>
<body>
  <h1>Lista de Tarefas</h1>
  <ul id="tarefas"></ul>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyrRXw06uSb6JLpC9svuLOWStNO5KugSFxuSCLu9BVlIPZoDXdZInYBIIzmxHHGobCL9Q/exec';

    // Obter tarefas do Google Sheets
    async function carregarTarefas() {
      try {
        const response = await fetch(WEB_APP_URL);
        if (!response.ok) throw new Error('Erro ao buscar dados');
        const tasks = await response.json();
        const lista = document.getElementById('tarefas');
        lista.innerHTML = '';
        tasks.forEach(t => {
          const li = document.createElement('li');
          li.textContent = `${t.day} - ${t.name} (${t.priority})`;
          lista.appendChild(li);
        });
      } catch (err) {
        console.warn('⚠️ Não foi possível salvar no Google Sheets. Usando LocalStorage.');
        const tasks = JSON.parse(localStorage.getItem('tarefas') || '[]');
        const lista = document.getElementById('tarefas');
        lista.innerHTML = '';
        tasks.forEach(t => {
          const li = document.createElement('li');
          li.textContent = `${t.day} - ${t.name} (${t.priority})`;
          lista.appendChild(li);
        });
      }
    }

    carregarTarefas();
  </script>
</body>
</html>
