<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Poupanças 2025</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<style>
  body {
    font-family: 'Inter', Arial, sans-serif;
    margin: 20px;
    background: #f0f2f5;
    color: #333;
  }
  h1 { font-weight: 700; text-align: center; margin-bottom: 30px; }
  .kpi-container {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
  }
  .kpi-box {
    background: #fff;
    padding: 20px 30px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    min-width: 200px;
    text-align: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .kpi-box:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.15);
  }
  .kpi-box h3 { margin: 10px 0 5px; font-weight: 600; color: #555; }
  .kpi-box p { font-size: 1.5rem; font-weight: 700; margin: 0; color: #222; }
  .charts-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    margin-top: 30px;
  }
  .chart-box {
    background: #fff;
    border-radius: 15px;
    padding: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    flex: 1 1 400px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .chart-box:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.15);
  }
  canvas { max-width: 100%; height: 350px; }
  h2 { margin-bottom: 5px; font-weight: 600; color: #555; }
  @media print {
    body { margin: 0; font-size: 12pt; }
    .chart-box, .kpi-box { box-shadow: none; }
  }
</style>
</head>
<body>

<h1>Dashboard de Poupanças 2025</h1>

<div class="kpi-container">
  <div class="kpi-box">
    <h3>Poupanças</h3>
    <p id="totalPoupanca">0 €</p>
  </div>
  <div class="kpi-box">
    <h3>Férias</h3>
    <p id="totalFerias">0 €</p>
  </div>
</div>

<div class="charts-container">
  <div class="chart-box">
    <h2>Poupanças</h2>
    <canvas id="chartPoupanca"></canvas>
  </div>
  <div class="chart-box">
    <h2>Férias</h2>
    <canvas id="chartFerias"></canvas>
  </div>
</div>

<script>
const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRyBCKIqCRwswkUQP_or3WI1dOG3JyQGyousdaS_6w_lTyRjJSXXnl5PeMW5jq2lQ/pub?output=csv&gid=1444389821';

fetch(csvUrl)
  .then(res => res.text())
  .then(csv => {
    const linhas = csv.trim().split('\n');
    const meses = [], fundoML = [], feriasML = [], linhaReferencia = [];

    linhas.slice(1).forEach((linha,i) => {
      const cols = linha.split(',');
      meses.push(cols[0]);
      const fundo = Number(cols[1].replace(/\s|€/g,'') || 0);
      const ferias = Number(cols[2].replace(/\s|€/g,'') || 0);
      fundoML.push(fundo);
      feriasML.push(ferias);

      // Linha de referência começa em março (índice 2)
      if(i < 2){
        linhaReferencia.push(null);
      } else {
        linhaReferencia.push(fundoML[i-1] + 200);
      }
    });

    // Atualizar KPIs (valor do último mês)
    const totalPoupanca = fundoML[fundoML.length - 1] || 0;
    const totalFerias = feriasML[feriasML.length - 1] || 0;

    document.getElementById('totalPoupanca').textContent = totalPoupanca.toLocaleString('pt-PT') + ' €';
    document.getElementById('totalFerias').textContent = totalFerias.toLocaleString('pt-PT') + ' €';

    function createBarChart(ctx, label, data, gradientColors, referenceLine=null){
      const grad = ctx.createLinearGradient(0,0,0,350);
      grad.addColorStop(0, gradientColors[0]);
      grad.addColorStop(1, gradientColors[1]);

      const datasets = [{
        label,
        data,
        backgroundColor: referenceLine 
          ? data.map((v,i) => (referenceLine[i] !== null && v > referenceLine[i]) ? grad : 'rgba(255,99,132,0.5)')
          : grad,
        borderRadius: 12
      }];

      if(referenceLine){
        datasets.push({
          label: 'Linha de referência',
          type: 'line',
          data: referenceLine,
          borderColor: 'rgba(0,128,0,0.9)',
          borderWidth: 2,
          pointRadius: 0,
          borderDash: [5,5],
          fill: false
        });
      }

      return new Chart(ctx, {
        type: 'bar',
        data: { labels: meses, datasets },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#333',
              titleColor: '#fff',
              bodyColor: '#fff',
              padding: 10,
              cornerRadius: 8,
              callbacks: {
                label: context => context.raw.toLocaleString('pt-PT') + ' €'
              }
            },
            datalabels: {
              anchor: 'end',
              align: 'end',
              color: '#222',
              font: { weight: 'bold' },
              formatter: val => val.toLocaleString('pt-PT') + ' €'
            }
          },
          scales: {
            x: { grid: { display: false } },
            y: { 
              beginAtZero: true,
              grid: { display: false },
              ticks: { callback: v => v.toLocaleString('pt-PT') + ' €' }
            }
          },
          interaction: { mode: 'index', intersect: false }
        },
        plugins: [ChartDataLabels]
      });
    }

    createBarChart(
      document.getElementById('chartPoupanca').getContext('2d'),
      'Poupanças',
      fundoML,
      ['rgba(0,200,0,0.85)','rgba(0,140,0,0.6)'],
      linhaReferencia
    );

    createBarChart(
      document.getElementById('chartFerias').getContext('2d'),
      'Férias',
      feriasML,
      ['rgba(54,162,235,0.85)','rgba(0,100,200,0.6)']
    );

  })
  .catch(err => console.error('Erro ao carregar CSV:', err));
</script>

</body>
</html>
