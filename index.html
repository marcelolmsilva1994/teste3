<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Poupanças 2025</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<style>
  body {
    font-family: 'Inter', Arial, sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #e0e7ff, #f5f7fa);
    color: #333;
  }

  h1 {
    font-weight: 800;
    text-align: center;
    margin: 30px 0;
    font-size: 2.5rem;
    color: #111;
    letter-spacing: 0.5px;
  }

  .container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .kpi-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
    margin-bottom: 40px;
  }

  .kpi-box {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(15px);
    padding: 25px 35px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    min-width: 220px;
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .kpi-box:hover {
    transform: translateY(-8px);
    box-shadow: 0 18px 35px rgba(0,0,0,0.15);
  }

  .kpi-box h3 {
    margin: 12px 0 8px;
    font-weight: 600;
    color: #555;
    font-size: 1.1rem;
  }

  .kpi-box p {
    font-size: 2rem;
    font-weight: 700;
    margin: 0;
    color: #222;
  }

  .kpi-poupanca { border-top: 5px solid #43a047; }
  .kpi-ferias { border-top: 5px solid #1e88e5; }

  .charts-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
  }

  .chart-box {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    flex: 1 1 400px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .chart-box:hover {
    transform: translateY(-8px);
    box-shadow: 0 18px 35px rgba(0,0,0,0.15);
  }

  canvas {
    max-width: 100%;
    height: 350px;
  }

  h2 {
    margin-bottom: 20px;
    font-weight: 700;
    font-size: 1.3rem;
    color: #333;
    text-align: center;
  }

  @media print {
    body { margin: 0; font-size: 12pt; background: #fff; }
    .chart-box, .kpi-box { box-shadow: none; border: 1px solid #ccc; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Dashboard de Poupanças 2025</h1>

  <div class="kpi-container">
    <div class="kpi-box kpi-poupanca">
      <h3>Poupanças</h3>
      <p id="totalPoupanca">0 €</p>
    </div>
    <div class="kpi-box kpi-ferias">
      <h3>Férias</h3>
      <p id="totalFerias">0 €</p>
    </div>
  </div>

  <div class="charts-container">
    <div class="chart-box">
      <h2>Evolução das Poupanças</h2>
      <canvas id="chartPoupanca"></canvas>
    </div>
    <div class="chart-box">
      <h2>Fundo para Férias</h2>
      <canvas id="chartFerias"></canvas>
    </div>
    <div class="chart-box" style="flex: 1 1 800px;">
      <h2>Resumo Anual</h2>
      <canvas id="chartResumo"></canvas>
    </div>
  </div>
</div>

<script>
const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRyBCKIqCRwswkUQP_or3WI1dOG3JyQGyousdaS_6w_lTyRjJSXXnl5PeMW5jq2lQ/pub?output=csv&gid=1444389821';

fetch(csvUrl)
  .then(res => res.text())
  .then(csv => {
    const linhas = csv.trim().split('\n');
    const meses = [], fundoML = [], feriasML = [], linhaReferencia = [];

    linhas.slice(1).forEach((linha,i) => {
      const cols = linha.split(',');
      meses.push(cols[0]);
      const fundo = Number(cols[1].replace(/\s|€/g,'') || 0);
      const ferias = Number(cols[2].replace(/\s|€/g,'') || 0);
      fundoML.push(fundo);
      feriasML.push(ferias);

      if(i < 2){
        linhaReferencia.push(null);
      } else {
        linhaReferencia.push(fundoML[i-1] + 200);
      }
    });

    document.getElementById('totalPoupanca').textContent = (fundoML[fundoML.length - 1] || 0).toLocaleString('pt-PT') + ' €';
    document.getElementById('totalFerias').textContent = (feriasML[feriasML.length - 1] || 0).toLocaleString('pt-PT') + ' €';

    function createBarChart(ctx, label, data, gradientColors, referenceLine=null){
      const grad = ctx.createLinearGradient(0,0,0,350);
      grad.addColorStop(0, gradientColors[0]);
      grad.addColorStop(1, gradientColors[1]);

      const datasets = [{
        label,
        data,
        backgroundColor: referenceLine 
          ? data.map((v,i) => (referenceLine[i] !== null && v > referenceLine[i]) ? grad : 'rgba(255,99,132,0.5)')
          : grad,
        borderRadius: 12
      }];

      if(referenceLine){
        datasets.push({
          label: 'Linha de referência',
          type: 'line',
          data: referenceLine,
          borderColor: 'rgba(0,128,0,0.9)',
          borderWidth: 2,
          pointRadius: 0,
          borderDash: [5,5],
          fill: false
        });
      }

      return new Chart(ctx, {
        type: 'bar',
        data: { labels: meses, datasets },
        options: {
          responsive: true,
          animation: { duration: 1200, easing: 'easeOutQuart' },
          plugins: {
            legend: { display: referenceLine ? true : false },
            tooltip: {
              backgroundColor: '#333',
              titleColor: '#fff',
              bodyColor: '#fff',
              padding: 10,
              cornerRadius: 8,
              callbacks: {
                label: context => context.raw.toLocaleString('pt-PT') + ' €'
              }
            },
            datalabels: {
              anchor: 'end',
              align: 'end',
              color: '#222',
              font: { weight: 'bold' },
              formatter: val => val > 0 ? val.toLocaleString('pt-PT') + ' €' : ''
            }
          },
          scales: {
            x: { grid: { display: false } },
            y: { beginAtZero: true, grid: { display: false }, ticks: { callback: v => v.toLocaleString('pt-PT') + ' €' } }
          },
          interaction: { mode: 'index', intersect: false }
        },
        plugins: [ChartDataLabels]
      });
    }

    function createResumoChart(ctx, poupancas, ferias){
      return new Chart(ctx, {
        type: 'line',
        data: {
          labels: meses,
          datasets: [
            {
              label: 'Poupanças',
              data: poupancas,
              borderColor: 'rgba(0,200,0,0.9)',
              backgroundColor: 'rgba(0,200,0,0.2)',
              fill: true,
              tension: 0.3
            },
            {
              label: 'Férias',
              data: ferias,
              borderColor: 'rgba(54,162,235,0.9)',
              backgroundColor: 'rgba(54,162,235,0.2)',
              fill: true,
              tension: 0.3
            }
          ]
        },
        options: {
          responsive: true,
          animation: { duration: 1200, easing: 'easeOutQuart' },
          plugins: {
            legend: { position: 'top' },
            tooltip: {
              callbacks: {
                label: context => context.raw.toLocaleString('pt-PT') + ' €'
              }
            }
          },
          scales: {
            y: { beginAtZero: true, grid: { display: false } },
            x: { grid: { display: false } }
          }
        }
      });
    }

    createBarChart(
      document.getElementById('chartPoupanca').getContext('2d'),
      'Poupanças',
      fundoML,
      ['rgba(0,200,0,0.85)','rgba(0,140,0,0.6)'],
      linhaReferencia
    );

    createBarChart(
      document.getElementById('chartFerias').getContext('2d'),
      'Férias',
      feriasML,
      ['rgba(54,162,235,0.85)','rgba(0,100,200,0.6)']
    );

    createResumoChart(
      document.getElementById('chartResumo').getContext('2d'),
      fundoML,
      feriasML
    );

  })
  .catch(err => console.error('Erro ao carregar CSV:', err));
</script>

</body>
</html>
